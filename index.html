 এটি সংকেত, উত্তর নয়","পরীক্ষা: চিকিৎসক দেখবেন এবং প্রয়োজনে কিছু টেস্ট দেবেন","রোগ নির্ণয়: কোনো অংশ অস্বাভাবিক মনে হলে নিশ্চিত হওয়ার একমাত্র উপায় বায়োপসি (biopsy) — আর বেশিরভাগ বায়োপসির ফল ক্যান্সার নয়","চিকিৎসা: ক্যান্সার হলে চিকিৎসক দল আপনার সাথে মিলে পরবর্তী পরিকল্পনা করবেন"]}],what_you_can_do:"কোনো পরিবর্তন দেখলে পরের ধাপ হলো চিকিৎসকের পরীক্ষা — দ্রুত চেকআপ করান। WHO-র লক্ষ্য হলো স্বাস্থ্যব্যবস্থা যেন ৬০ দিনের মধ্যে রোগ নির্ণয় করে, আর সেই সময় শুরু হয় আপনার প্রথম ডাক্তার দেখানো থেকে।"},support:{heading:"কীভাবে পাশে থাকবেন",summary:"নিখুঁত কথার দরকার নেই। পাশে থাকা আর মন দিয়ে শোনা — প্রায়ই এটাই সবচেয়ে বেশি কাজে আসে।",sections:[{title:"যেভাবে সাহায্য করতে পারেন",bullets:["অনুভূতি বদলে দেওয়ার বা তাড়া দেওয়ার চেষ্টা না করে শুনুন","নির্দিষ্ট সাহায্যের প্রস্তাব দিন: খাবার, কেনাকাটা, ডাক্তারের কাছে আনা-নেওয়া","ছোট ছোট বার্তা, ফোন বা দেখা করে নিয়মিত খোঁজ নিন","চিকিৎসা-সংক্রান্ত পরামর্শ তার চিকিৎসক দলের ওপর ছেড়ে দিন"]}],what_you_can_do:"জিজ্ঞেস করুন, “এই সপ্তাহে কোন কাজটা করলে তোমার সবচেয়ে সুবিধা হবে?” — আর উত্তর যা-ই হোক, সম্মান করুন।"},men:{heading:"হ্যাঁ — পুরুষেরও স্তন ক্যান্সার হতে পারে",summary:"পুরুষের শরীরেও স্তনের টিস্যু থাকে, তাই পুরুষেরও স্তন ক্যান্সার হতে পারে। এটি কম দেখা যায় — WHO-র হিসাবে মোট স্তন ক্যান্সারের প্রায় ০.৫–১% পুরুষের হয় — তবে এটি বাস্তব।",sections:[{title:"পুরুষের লক্ষণ",bullets:["বুকে বা বগলে চাকা বা ফোলা","নিপলে পরিবর্তন, যেমন ভেতরের দিকে ঢুকে যাওয়া বা র‍্যাশ","নিপল থেকে তরল বের হওয়া, কখনো রক্তমিশ্রিত","বুকে ঘা, বা আকার-আকৃতিতে পরিবর্তন"]},{title:"যাদের ঝুঁকি বেশি",bullets:["বেশি বয়স","আগে বুকে রেডিয়েশন নেওয়া","BRCA1 বা BRCA2-এর মতো বংশগত জিনগত পরিবর্তন"]}],what_you_can_do:"বুকে অস্বাভাবিক কোনো পরিবর্তন দেখলে চিকিৎসক দেখান — এতে লজ্জার কিছু নেই। এর কিছু লক্ষণের অন্য কারণও থাকতে পারে, আর চিকিৎসকই তা নির্ণয় করতে পারবেন।"},mother:{heading:"মায়ের জন্য",summary:"বয়স বাড়ার সাথে স্তন ক্যান্সারের সম্ভাবনা বাড়ে, তাই মায়েদের সাথে এই আলোচনা জরুরি। আপনার যত্ন তাকে কোনো পরিবর্তন পরীক্ষা করাতে সহজ করে দিতে পারে।",sections: s:[{title:"জেনে রাখুন",bullets:["BRCA1 ও BRCA2-এর মতো বংশগত জিনগত পরিবর্তন নারী — এবং পুরুষ — উভয়ের ঝুঁকি বাড়ায়","মাত্র ৫–১০% স্তন ক্যান্সার বংশগত বলে ধারণা করা হয়","পারিবারিক ইতিহাস জানা থাকলে চিকিৎসক আরও ভালো পরামর্শ দিতে পারেন"]}],what_you_can_do:"পরিবারে কার স্তন ক্যান্সার হয়েছিল এবং জানা থাকলে কোন বয়সে — তা নিয়ে পরিবারে আলোচনা করুন। পরিবারের নারীদের তা চিকিৎসককে জানাতে উৎসাহ দিন।"},"family-diagnosed":{heading:"পরিবারের কারও রোগ নির্ণয় হলে",summary:"পুরো পরিবারের জন্যই এটি কঠিন সময় হতে পারে। প্রতিটি গল্প আলাদা — তাই সবচেয়ে ভালো সহযোগিতা হলো তার যা দরকার সেটা, আমরা যা ধরে নিই সেটা নয়।",sections:[{title:"যেভাবে সাহায্য করতে পারেন",bullets:["মন দিয়ে শুনুন, আলোচনার নেতৃত্ব তাকে দিন","ব্যবহারিক কাজে সাহায্য করুন: অ্যাপয়েন্টমেন্ট, খাবার, কেনাকাটা, সন্তানের দেখাশোনা","চিকিৎসা-সংক্রান্ত সিদ্ধান্ত ও পরামর্শ তার চিকিৎসক দলের ওপর ছেড়ে দিন","নিজের যত্নও নিন — আপনি স্থির থাকলে পাশে থাকা সহজ হয়"]},{title:"পরিবারের অন্যদের জন্য",bullets:["ঘনিষ্ঠ নারী আত্মীয়রা এই পারিবারিক ইতিহাসের কথা নিজেদের চিকিৎসককে জানাতে পারেন"]}],what_you_can_do:"তাকে জিজ্ঞেস করুন, “এখন কোন জিনিসটা সবচেয়ে বেশি সাহায্য করবে?” — আর তার উত্তরকে সম্মান করুন।"},"noticed-change":{heading:"পরিবর্তন পরীক্ষা করানো",summary:"চাকা বা পরিবর্তন দেখলে ভয় লাগতেই পারে। এর মানেই ক্যান্সার নয়, আর বেশিরভাগ স্তনের চাকা ক্যান্সার নয়। তবে নতুন বা অস্বাভাবিক পরিবর্তন হলে চিকিৎসককে দিয়ে পরীক্ষা করানো দরকার, যাতে কারণটি জানা যায়।",sections:[{title:"পরের ধাপ",bullets:["দ্রুত চিকিৎসক বা স্বাস্থ্যকেন্দ্রে যান","কবে খেয়াল করলেন এবং কোনো পরিবর্তন হয়েছে কি না, লিখে রাখুন","অন্য পরিবর্তন (ত্বক, নিপল) ও পারিবারিক ইতিহাসের কথা জানান","চাইলে বিশ্বস্ত কাউকে সাথে নিন"]}],what_you_can_do:"বয়স যা-ই হোক, নিজে থেকে সেরে যাবে ভেবে অপেক্ষা করবেন না। চেকআপ করালেই আসল উত্তর জানা যায় এবং পরবর্তী পরিকল্পনা করা যায়।"},pain:{heading:"স্তনে ব্যথা নিয়ে",summary:"স্তনে ব্যথা খুব সাধারণ, এবং মাসিক, আঘাত বা কিছু ওষুধসহ নানা কারণে হতে পারে। শুধু ব্যথা সাধারণত ক্যান্সারের লক্ষণ নয় — তবে স্তন ক্যান্সারের চাকা প্রায়ই ব্যথাহীন, তাই অন্য পরিবর্তনও খেয়াল রাখুন।",sections:[{title:"চিকিৎসক দেখান যদি",bullets:["ব্যথা না কমে, বা ব্যথানাশক ওষুধে কাজ না হয়","ব্যথার সাথে চাকা, ফোলা, বা ত্বক কিংবা নিপলে পরিবর্তন থাকে","বেশি জ্বর থাকে, বা স্তন লাল, গরম কিংবা ফোলা হয় — সেদিনই চিকিৎসা নিন"]}],what_you_can_do:"কখন ব্যথা হয়, ছোট করে লিখে রাখুন। চিকিৎসক পরীক্ষা করে কারণ খুঁজে বের করতে সাহায্য করবেন।"},awareness:{heading:"নিজের স্বাভাবিক অবস্থা জানা",summary:"উদ্দেশ্য হলো আপনার স্তন সাধারণত দেখতে ও ছুঁয়ে কেমন লাগে তা জানা, যাতে কোনো পরিবর্তন হলে বুঝতে পারেন।",sections:[{title:"সহজ অভ্যাস",bullets:["আয়নায় দেখুন — প্রথমে হাত নামিয়ে, তারপর হাত উঁচু করে","প্রতিটি স্তন কলারবোন পর্যন্ত এবং বগলের নিচ পর্যন্ত ছুঁয়ে দেখুন","নিপলের চারপাশে ও ওপরে ছুঁয়ে দেখুন","নতুন যেকোনো কিছু খেয়াল করুন — শুধু চাকা নয়"]}],what_you_can_do:"কোনো পরিবর্তন দেখলে অপেক্ষা না করে চিকিৎসক দেখান। নিজে পরীক্ষা করা চিকিৎসকের পরামর্শ দেওয়া স্ক্রিনিংয়ের বিকল্প নয়।"},interpret:{heading:"এটি আপনার চিকিৎসকের কাজ",summary:"আমি ম্যামোগ্রাম, স্ক্যান, টেস্ট রিপোর্ট বা ছবি দেখে ব্যাখ্যা করতে পারি না — অনুমানও করব না। যে চিকিৎসক বা ক্লিনিক পরীক্ষাটি করিয়েছেন, তারাই ফলাফল ঠিকভাবে বুঝিয়ে দিতে পারবেন।",sections:[{title:"তাদের যা জিজ্ঞেস করতে পারেন",bullets:["এই ফলাফলের মানে আমার জন্য কী?","আর কোনো পরীক্ষা লাগবে? কবে?","কী খেয়াল রাখব, আর কবে আবার আসব?"]}],what_you_can_do:"অ্যাপয়েন্টমেন্টের আগে প্রশ্নগুলো লিখে নিন, আর চাইলে কাউকে সাথে নিন।"},treatment:{heading:"চিকিৎসার সিদ্ধান্ত চিকিৎসক দলের",summary:"আমি কোনো চিকিৎসা বেছে দিতে বা কারও সম্ভাবনা অনুমান করতে পারি না — এটি নির্ভর করে এমন বিষয়ের ওপর, যা শুধু চিকিৎসক দলই বিচার করতে পারেন। সাধারণভাবে, স্তন ক্যান্সারের চিকিৎসায় অস্ত্রোপচার, রেডিয়েশন থেরাপি ও ওষুধ থাকতে পারে।",sections:[{title:"চিকিৎসক দলকে যা জিজ্ঞেস করবেন",bullets:["আমার জন্য কী কী উপায় আছে, এবং কেন?","উপকার ও পার্শ্বপ্রতিক্রিয়া কী?","আমার ও পরিবারের জন্য কী সহায়তা পাওয়া যায়?"]}],what_you_can_do:"কোনো কিছু আবার বুঝিয়ে বলতে বলা একদম স্বাভাবিক। মনে রাখতে সুবিধা হলে কাউকে সাথে নিয়ে যান।"},remedies:{heading:"ভেষজ বা “প্রাকৃতিক চিকিৎসা” নিয়ে",summary:"স্তন ক্যান্সারের চিকিৎসা হিসেবে আমি কোনো ভেষজ বা বিকল্প চিকিৎসার পরামর্শ দিতে পারি না। প্রমাণিত চিকিৎসা আসে যোগ্য চিকিৎসক দলের কাছ থেকে।",sections:[],what_you_can_do:"আপনি বা প্রিয় কেউ কোনো প্রতিকার নেওয়ার কথা ভাবলে আগে চিকিৎসকের সাথে কথা বলুন — আর স্তনের কোনো পরিবর্তন পরীক্ষা করাতে দেরি করবেন না।"},thanks:{heading:"আপনাকেও ধন্যবাদ 💗",summary:"কিছুক্ষণ সময় নিয়ে জানার জন্য ধন্যবাদ। যা জানলেন, তা প্রিয় কাউকে জানানোই হতে পারে চমৎকার পরের ধাপ।",sections:[],what_you_can_do:"যেকোনো সময় আরেকটি প্রশ্ন করুন, অথবা “শেষ করেছি” চাপুন।"},general:{heading:"আমি যেভাবে সাহায্য করতে পারি",summary:"আমি স্তন স্বাস্থ্য নিয়ে বিশ্বস্ত, সাধারণ তথ্য দিই: কোন লক্ষণ খেয়াল রাখবেন, ঝুঁকির কারণ, স্ক্রিনিং, আর কীভাবে কারও পাশে থাকবেন। আমি রোগ নির্ণয় বা ব্যক্তিগত চিকিৎসা-পরামর্শ দিতে পারি না।",sections:[],what_you_can_do:"নিচের কোনো প্রশ্ন বেছে নিন, অথবা নিজের ভাষায় জিজ্ঞেস করুন। নিজের শরীর বা উপসর্গ নিয়ে কিছু হলে একজন চিকিৎসকই সঠিক মানুষ।"}},ec={en:{"w-signs":"What breast changes should I know about?","m-signs":"What signs should I know about?","w-lump":"Does every lump mean cancer?","w-doctor":"When should I see a doctor?",risk:"What are the risk factors?",young:"Can younger women get breast cancer?",screening:"What does breast screening mean?",family:"What if breast cancer runs in my family?","no-family":"Can it happen without a family history?",pathway:"What is the difference between a symptom and a diagnosis?",support:"How can I support someone with breast cancer?",men:"Can men get breast cancer?",mother:"What should I know for my mother?",partner:"What should I know for my wife?",sister:"What should I know for my sister?",daughter:"What should I know for my daughter?",talk:"How do I talk to her about it?",afraid:"What if she is afraid to see a doctor?","family-m":"Does family history matter?","family-diagnosed":"Someone in my family has breast cancer. How can I help?",awareness:"How do I check my breasts?",pain:"Is breast pain a sign of cancer?"},bn:{"w ing or other skin changes","Nipple changes, or nipple fluid that’s unusual or bloody"]}],what_you_can_do:"Get to know how your breasts normally look and feel. If you notice something new or unusual, book a visit with a doctor or health centre — it doesn’t need to hurt to be worth checking.",follow_ups:[fe.lump,fe.doctor],sourceIds:["who-factsheet","nhs-women-symptoms"]},"m-signs":{tone:"info",heading:"Signs to know",summary:"Whether it’s for the women in your life or for yourself, these are the changes worth noticing. They can have many causes, but a new or unusual change deserves a check.",sections:[{title:"In women",bullets:["A new lump or thickening in the breast or armpit","A change in the size, shape or look of a breast","Skin dimpling, redness or other skin changes","Nipple changes, or unusual or bloody nipple fluid"]},{title:"In men (less common)",bullets:["A lump or swelling in the chest or armpit","Nipple changes, discharge, or sores on the chest"]}],what_you_can_do:"If someone mentions a change, take it seriously and gently encourage a check with a doctor. You don’t need to know the cause — that’s the doctor’s job.",follow_ups:[ye.talk,ye.men],sourceIds:["who-factsheet","nhs-women-symptoms","nhs-men-symptoms"]},"w-lump":{tone:"supportive",heading:"A lump is a signal, not an answer",summary:"A breast lump does not automatically mean cancer — WHO notes that most breast lumps are not cancer. But a new or unusual lump should be checked by a health professional, so the cause can be found.",sections:[{title:"What matters",bullets:["Lumps can have many causes, including non-cancerous ones","A painless lump still deserves a check","Only tests can find the cause — sometimes that includes a biopsy"]},{title:"Helpful to tell the doctor",bullets:["When you first noticed it","Whether it has changed since","Any other changes, like skin or nipple changes","Any family history of breast cancer"]}],what_you_can_do:"Book an appointment with a doctor or health centre soon. Tr reast cancer becomes more common with age, but younger women can get it too. In the United States, for example, about 1 in 10 new cases is found in women under 45 (CDC).",sections:[{title:"What matters",bullets:["Being young lowers the chance — it doesn’t remove it","In younger women, breast cancer is more likely to be linked to inherited genes","Knowing what’s normal for your body helps you notice what’s new"]}],what_you_can_do:"Don’t dismiss a change because of your age. If something new or unusual appears, see a doctor. If close relatives have had breast cancer, mention it — it may change the advice you get.",follow_ups:[fe.family,fe.signs],sourceIds:["cdc-young","acs-risk"]},screening:{tone:"info",heading:"What screening means",summary:"Screening means checking the breasts for cancer before there are any signs or symptoms. It’s different from getting a new change checked.",sections:[{title:"The right plan depends on",bullets:["Age and personal risk","Family history","Your country’s clinical guidelines","Which screening services are available near you"]}],what_you_can_do:"Ask a qualified health professional which screening is right for you, and when. And if you notice a change, don’t wait for screening — get it checked.",follow_ups:[fe.risk,fe.doctor],byMode:{man:{follow_ups:[ye.mother,ye.family]}},sourceIds:["cdc-screening","who-factsheet"]},family:{tone:"info",heading:"If breast cancer runs in your family",summary:"Family history can raise risk — having a mother, sister or daughter with breast cancer almost doubles it. But higher risk is not a diagnosis, and having a family history doesn’t mean you will get breast cancer.",sections:[{title:"What matters",bullets:["Close relatives count most: mother, sister, daughter","Some families carry inherited gene changes, like BRCA1 or BRCA2","Only about 5–10% of breast cancers are thought to be hereditary"]}],what_you_can_do:"Write down who in your family had breast cancer and, if you know, at what age. Share this with a s:[ye.afraid,ye.signs],sourceIds:["who-factsheet","acs-risk","cdc-screening"]},partner:{tone:"supportive",heading:"For your wife or partner",summary:"As her partner, you may be one of the first people she talks to about a change. Calm, steady support can make a real difference.",sections:[{title:"What helps",bullets:["Know the signs, so a change doesn’t go unnoticed","If she mentions a change, take it seriously — without panic","Respect her privacy and her choices about her body","Help with practical things: booking, travel, childcare, time off"]}],what_you_can_do:"Try: “Let’s get it checked so we know what’s going on. I’ll come with you if you want.” Then follow her lead.",follow_ups:[ye.talk,ye.support],sourceIds:["who-factsheet","acs-friend"]},sister:{tone:"supportive",heading:"For your sister",summary:"Sisters share family history — so if breast cancer has affected your family, it matters for her too. Your support can help her feel less alone in getting a change checked.",sections:[{title:"What helps",bullets:["Know the signs and share what you’ve learned","If a close relative had breast cancer, encourage her to tell her doctor","Remember: no family history doesn’t mean no risk","Offer to go with her if she needs a check-up"]}],what_you_can_do:"Share this page with her, or start with: “I learned something at work today — can I share it?” Keep it light, kind and practical.",follow_ups:[ye.family,ye.signs],sourceIds:["acs-risk","nbcf-family","who-factsheet"]},daughter:{tone:"supportive",heading:"For your daughter",summary:"Breast cancer is less common in younger women, but it can happen. The most useful gift is helping her feel comfortable knowing her body and speaking up about changes.",sections:[{title:"What helps",bullets:["Make it normal to talk about health without embarrassment","Encourage her to know what’s normal for her own body","If close relatives had breast cancer, make sure she — and her doctor — know","If she notices a change, help her see a doctor rather than worry alone"]}],what_you_can_do:"Let her know she can always come to you — or another trusted woman in the family — with any health question. Being approachable matters more than having every answer.",follow_ups:[ye.family,ye.talk],sourceIds:["cdc-young","acs-risk"]},talk:{tone:"supportive",heading:"Talking without frightening",summary:"A calm, caring tone helps someone act on a concern without feeling scared. You don’t need medical answers — just kindness and a next step.",sections:[{title:"Try this",bullets:["Choose a private, calm moment","Start with care: “I’ve been thinking about you…”","Don’t guess: say “let’s get it checked”, not “it’s nothing” or “it could be cancer”","Offer help: “I can book it, or come with you”"]}],what_you_can_do:"Listen more than you speak, and let her decide the next step. If she’s worried, remind her that many breast changes have other causes — and checking is how you find out.",follow_ups:[ye.afraid,ye.support],sourceIds:["acs-friend","who-factsheet","nhs-women-symptoms"]},afraid:{tone:"supportive",heading:"When someone is afraid to go",summary:"Fear is very normal. Gentle, patient encouragement usually helps more than pressure.",sections:[{title:"What helps",bullets:["Acknowledge the fear: “It’s okay to feel scared”","Remind her that a lump or change isn’t automatically cancer — getting checked is the only way to know","Make it easier: offer to book, travel or wait with her","If she’d feel more comfortable with a female doctor, help her find one"]}],what_you_can_do:"Keep the door open and check in kindly — but don’t let it slide: a new change should be checked soon. If symptoms get worse or she feels unwell, encourage prompt care.",follow_ups:[ye.talk,ye.partner],sourceIds:["who-factsheet","acs-friend"]},"family-m":{tone:"info",heading:"Yes — family history matters",summary:"If a woman’s mother, sister or daughter has had breast cancer, her own risk is higher — one close relative almost doubles it. Still, most people diagnosed have no family history, so noticing changes matters for everyone.",sections:[{title:"Good to know",bullets:["Inherited gene changes like BRCA1 and BRCA2 raise risk for women — and for men","Only about 5–10% of breast cancers are thought to be hereditary","Knowing your family’s history helps doctors give better advice"]}],what_you_can_do:"Talk as a family about who has had breast cancer, and at what age if you know. Encourage the women in your family to share it with their doctor.",follow_ups:[ye.familyDiagnosed,ye.sister],sourceIds:["acs-risk","nbcf-family","nci-male"]},"family-diagnosed":{tone:"supportive",heading:"When someone in your family is diagnosed",summary:"It can feel overwhelming for the whole family. Every story is unique — so the best support follows what she needs, not what we assume.",sections:[{title:"Ways to help",bullets:["Listen, and let her lead the conversation","Help with practical things: appointments, meals, errands, children","Leave medical decisions and advice to her care team","Look after yourself too — support is easier when you’re steady"]},{title:"For the rest of the family",bullets:["Close female relatives may want to tell their own doctor about this family history"]}],what_you_can_do:"Ask her, “What would help most right now?” — and respect her answer.",follow_ups:[ye.support,ye.family],sourceIds:["acs-friend","acs-risk"]},"noticed-change":{tone:"supportive",heading:"Getting a change checked",summary:"Finding a lump or change can feel scary. It doesn’t automatically mean cancer, and most breast lumps are not cancer. But a new or unusual change should be checked by a health professional so the cause can be found.",sections:[{title:"Next steps",bullets:["Book a visit with a doctor or health centre soon","Note when it was noticed and whether it has changed","Mention other changes (skin, nipple) and any family history","Bring a trusted person along if that helps"]}],what_you_can_do:"Whatever the age, try not to wait to see if it goe ps://www.who.int/news-room/events/detail/2026/10/01/default-calendar/breast-cancer-awareness-month-2026",checked:"2026-10-03",supports:["Official 2026 theme: “Every story is unique, every journey matters.”","In 2024, 2.4 million women were diagnosed with breast cancer worldwide, and 694,000 women died from it.","Key messages: know your risk, know the signs, keep talking, keep supporting."]},"who-factsheet":{publisher:"World Health Organization",title:"Breast cancer — fact sheet (updated 3 July 2026)",url:"https://www.who.int/news-room/fact-sheets/detail/breast-cancer",checked:"2026-10-03",supports:["Signs: lump or thickening (often without pain); change in size, shape or appearance; dimpling, redness, pitting or other skin changes; nipple or areola changes; abnormal or bloody nipple fluid.","“Most breast lumps are not cancer.”","Risk factors include increasing age, obesity, harmful use of alcohol, family history, radiation exposure, reproductive history (such as age periods began and age at first pregnancy), tobacco use and postmenopausal hormone therapy.","Most breast cancers occur in women with no specific risk factors other than sex and age.","Inherited changes in genes such as BRCA1, BRCA2 and PALB2 greatly increase risk.","Approximately 0.5–1% of breast cancers occur in men.","Screening means using mammography in apparently healthy people, usually women aged 50–69 in organised programmes.","“Treatment combines surgery, radiation therapy and medications.”"]},"who-gbci":{publisher:"World Health Organization",title:"Global Breast Cancer Initiative",url:"https://www.who.int/initiatives/global-breast-cancer-initiative",checked:"2026-10-03",supports:["Aim: reduce breast cancer deaths by 2.5% per year.","Three pillars: health promotion for early detection, timely diagnosis, and comprehensive breast cancer management.","Timely diagnosis target: within 60 days."]},"nhs-women-symptoms":{publisher:"NHS (UK)",title:"Symptoms of breast cancer in women",url:"https://www.nhs.uk/conditions/breast-cancer-in-women/symptoms-of-breast-cancer-in-women/",checked:"2026-10-03",supports:["A lump or swelling in the breast, chest or armpit can be a symptom.","Some symptoms, including breast lumps, are very common and can be caused by other conditions — but it is important to get checked.","Finding cancer early may mean it is easier to treat."]},"nhs-men-symptoms":{publisher:"NHS (UK)",title:"Symptoms of breast cancer in men",url:"https://www.nhs.uk/conditions/breast-cancer-in-men/symptoms-of-breast-cancer-in-men/",checked:"2026-10-03",supports:["Symptoms in men: lump or swelling in the chest or armpit; nipple discharge; change in size or shape of the chest; sores; nipple turning inwards or a rash.","Some of these symptoms are common and can be caused by other conditions."]},"nci-male":{publisher:"U.S. National Cancer Institute",title:"Male Breast Cancer Treatment (PDQ®) — Patient Version",url:"https://www.cancer.gov/types/breast/patient/male-breast-treatment-pdq",checked:"2026-10-03",supports:["Men can get breast cancer because they also have breast tissue.","Risk factors in men include older age, radiation to the chest, inherited BRCA1/BRCA2 changes, Klinefelter syndrome, liver disease, testicular problems and obesity.","Check with a doctor about any unusual breast changes."]},"cdc-young":{publisher:"U.S. Centers for Disease Control and Prevention",title:"Breast Cancer in Young Women (Bring Your Brave)",url:"https://www.cdc.gov/bring-your-brave/breast-cancer-in-young-women/index.html",checked:"2026-10-03",supports:["In the United States, about 10% of new breast cancer cases are found in women younger than 45.","Breast cancer in younger women is more likely to be hereditary.","Learn your body and talk with a health care provider about concerns."]},"cdc-screening":{publisher:"U.S. Centers for Disease Control and Prevention",title:"Screening for Breast Cancer",url:"https://www.cdc.gov/breast-cancer/screening/index.html",checked:"2026-10-03",supports:["Screening means checking breasts for cancer before there are signs or symptoms.","Talk to your doctor about which screening tests are right for you and when."]},"acs-risk":{publisher:"American Cancer Society",title:"Breast Cancer Risk Factors You Cannot Change",url:"https://www.cancer.org/cancer/types/breast-cancer/risk-and-prevention/breast-cancer-risk-factors-you-cannot-change.html",checked:"2026-10-03",supports:["Risk increases with age.","Breast cancer in a first-degree relative (mother, sister, daughter) affects personal risk; one affected first-degree relative almost doubles risk."]},"acs-biopsy":{publisher:"American Cancer Society",title:"Breast Biopsy",url:"https://www.cancer.org/cancer/types/breast-cancer/screening-tests-and-early-detection/breast-biopsy.html",checked:"2026-10-03",supports:["“A biopsy is the only way to know for sure if an abnormal area is cancer.”","“While most biopsy results are not cancer, a biopsy is needed to find out for sure.”"]},"nbcf-family":{publisher:"National Breast Cancer Foundation",title:"Myth: If you have a family history of breast cancer, you are likely to develop it too",url:"https://www.nationalbreastcancer.org/breast-cancer-myths/if-you-have-a-family-history-of-breast-cancer-you-are-likely-to-develop-breast-cancer-too/",checked:"2026-10-03",supports:["Most women who get breast cancer have no family history.","About 5–10% of breast cancers are thought to be hereditary."]},"acs-friend":{publisher:"American Cancer Society",title:"Being a Friend to Someone With Cancer",url:"https://www.cancer.org/cancer/caregivers/how-to-be-a-friend-to-someone-with-cancer.html",checked:"2026-10-03",supports:["Being there and willing to listen matters more than what you say.","Offer practical help (meals, errands, rides to appointments); respect their answer.","Keep in touch with brief, frequent messages, calls or short visits.","Avoid unsolicited medical advice."]},"nhs-breast-pain":{publisher:"NHS (UK)",title:"Breast pain",url:"https://www.nhs.uk/conditions/breast-pain/",checked:"2026-10-03",supports:["“Breast pain by itself is unlikely to be a symptom of cancer.”","Common causes include periods, injuries, some medicines, pregnancy and menopause.","See a GP if pain is not improving; get urgent help for high fever, or redness, heat or swelling in the breast."]},"nhs-check":{publisher:"NHS (UK)",title:"How should I check my breasts?",url:"https://www.nhs.uk/common-health-questions/womens-health/how-should-i-check-my-breasts/",checked:"2026-10-03",supports:["Look in a mirror with arms down and then raised.","Feel each breast or side of the chest up to the collarbone and under each armpit.","See a GP about any changes that are not normal for you."]}},fv=["who-bcam-2026","who-factsheet","who-gbci","nhs-women-symptoms","nhs-men-symptoms","nhs-breast-pain","nhs-check","nci-male","cdc-young","cdc-screening","acs-risk","acs-biopsy","nbcf-family","acs-friend"];function hv(r=fv){return r.filter(y=>Zm[y]).map(y=>({id:y,...Zm[y]}))}function dv({ids:r,onClose:y}){const d=Pt(),o=G.useRef(null),E=G.useRef(null),z=hv(r),R=!!(r!=null&&r.length);return G.useEffect(()=>{var O;const _=document.activeElement;(O=E.current)==null||O.focus(),document.body.classList.add("no-scroll");const C=N=>{if(N.key==="Escape"&&y(),N.key==="Tab"&&o.current){const p=o.current.querySelectorAll("a[href], button:not([disabled])");if(!p.length)return;const D=p[0],H=p[p.length-1];N.shiftKey&&document.activeElement===D?(N.preventDefault(),H.focus()):!N.shiftKey&&document.activeElement===H&&(N.preventDefault(),D.focus())}};return document.addEventListener("keydown",C),()=>{var N;document.removeEventListener("keydown",C),document.body.classList.remove("no-scroll"),(N=_==null?void 0:_.focus)==null||N.call(_,{preventScroll:!0})}},[y]),i.jsx("div",{className:"sheet",role:"presentation",onClick:y,children:i.jsxs("div",{className:"sheet__panel",role:"dialog","aria-modal":"true","aria-labelledby":"sheet-title",ref:o,onClick:_=>_.stopPropagation(),child
